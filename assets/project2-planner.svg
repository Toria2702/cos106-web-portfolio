  <rect x="40" y="132" width="190" height="28" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="48" y="150" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">COS 106 - Web Tech</text>

  <rect x="40" y="169" width="190" height="28" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="48" y="187" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Due: 2026-11-05</text>

  <rect x="40" y="206" width="190" height="28" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="48" y="224" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="11">&bull; High Priority</text>

  <rect x="40" y="255" width="190" height="34" rx="4" fill="#2563eb"/>
  <text x="92" y="276" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Add Task</text>

  <!-- Right Tasks List Panel -->
  <rect x="260" y="55" width="315" height="260" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
