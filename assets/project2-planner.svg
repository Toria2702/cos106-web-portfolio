  <rect x="275" y="70" width="50" height="22" rx="3" fill="#2563eb"/>
  <text x="288" y="85" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">All (4)</text>
  
  <rect x="330" y="70" width="65" height="22" rx="3" fill="#0f172a"/>
  <text x="338" y="85" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Pending (3)</text>
  
  <rect x="400" y="70" width="75" height="22" rx="3" fill="#0f172a"/>
  <text x="408" y="85" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Completed (1)</text>

  <!-- Task item 1 -->
  <rect x="275" y="105" width="285" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="285" y="118" width="14" height="14" rx="2" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="310" y="125" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Submit COS 106 Web Portfolio</text>
  <text x="310" y="139" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">COS 106 &bull; Due Nov 5 &bull; <tspan fill="#f87171">High Priority</tspan></text>

  <!-- Task item 2 -->
  <rect x="275" y="155" width="285" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="285" y="168" width="14" height="14" rx="2" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="310" y="175" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">C++ Data Structures Lab Exercise</text>
  <text x="310" y="189" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">COS 101 &bull; Due Nov 8 &bull; <tspan fill="#fbbf24">Medium Priority</tspan></text>

  <!-- Task item 3 (completed) -->
  <rect x="275" y="205" width="285" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="285" y="218" width="14" height="14" rx="2" fill="#10b981"/>
  <path d="M288 225 l3 3 l6 -6" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <text x="310" y="225" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11" text-decoration="line-through">Download MIVA Lecture Slides</text>
  <text x="310" y="239" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="10">&bull; Completed</text>

  <!-- Progress bar -->
  <rect x="275" y="260" width="285" height="8" rx="4" fill="#334155"/>
  <rect x="275" y="260" width="71" height="8" rx="4" fill="#10b981"/>
  <text x="275" y="285" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">25% of semester tasks completed</text>
</svg>
