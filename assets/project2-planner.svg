    </linearGradient>
  </defs>
  <!-- Window background -->
  <rect width="600" height="340" rx="8" fill="url(#grad2)"/>
  
  <!-- Window header -->
  <rect width="600" height="36" rx="8" fill="#1e293b"/>
  <circle cx="20" cy="18" r="6" fill="#ef4444"/>
  <circle cx="38" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="6" fill="#10b981"/>
  <text x="80" y="22" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Academic Task &amp; Assignment Planner Dashboard</text>

  <!-- Left Form Panel -->
  <rect x="25" y="55" width="220" height="260" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
