<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <!-- Window background -->
  <rect width="600" height="340" rx="8" fill="url(#grad3)"/>
  
  <!-- Window header -->
  <rect width="600" height="36" rx="8" fill="#1f2937"/>
  <circle cx="20" cy="18" r="6" fill="#ef4444"/>
  <circle cx="38" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="6" fill="#10b981"/>
  <text x="80" y="22" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Dijkstra &amp; A* Pathfinding Grid Simulator - C++ &amp; Web Engine</text>

  <!-- Controls bar -->
  <rect x="25" y="48" width="550" height="38" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="35" y="55" width="90" height="24" rx="3" fill="#2563eb"/>
  <text x="45" y="71" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">&#9654; Run Dijkstra</text>
  
  <rect x="135" y="55" width="80" height="24" rx="3" fill="#374151"/>
  <text x="145" y="71" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="11">Clear Grid</text>
  
  <text x="235" y="71" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="11">Visited: <tspan fill="#38bdf8" font-weight="bold">142 nodes</tspan> &bull; Path Length: <tspan fill="#34d399" font-weight="bold">28 steps</tspan></text>

  <!-- Grid visualization canvas -->
  <g transform="translate(25, 95)">
    <!-- Base grid background -->
    <rect width="550" height="215" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Grid cells pattern -->
    <!-- Start Node -->
    <rect x="30" y="80" width="22" height="22" rx="3" fill="#10b981"/>
    <text x="36" y="96" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">S</text>
    
    <!-- Target Node -->
    <rect x="490" y="120" width="22" height="22" rx="3" fill="#ef4444"/>
    <text x="497" y="136" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">T</text>

    <!-- Obstacle Wall -->
    <rect x="200" y="20" width="22" height="140" rx="3" fill="#374151"/>
    <rect x="320" y="60" width="22" height="140" rx="3" fill="#374151"/>

    <!-- Explored Nodes (Cyan / Blue cloud) -->
    <rect x="60" y="70" width="130" height="50" rx="3" fill="#0284c7" opacity="0.3"/>
    <rect x="90" y="50" width="100" height="90" rx="3" fill="#0284c7" opacity="0.2"/>
    <rect x="230" y="130" width="80" height="60" rx="3" fill="#0284c7" opacity="0.35"/>
    <rect x="350" y="40" width="130" height="110" rx="3" fill="#0284c7" opacity="0.25"/>

    <!-- Optimal Path (Yellow / Green line) -->
    <path d="M 41 91 L 180 91 L 180 180 L 300 180 L 300 40 L 470 40 L 470 131 L 501 131" 
          stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Grid Dots overlay -->
    <circle cx="90" cy="91" r="2" fill="#38bdf8"/>
    <circle cx="130" cy="91" r="2" fill="#38bdf8"/>
    <circle cx="180" cy="130" r="2" fill="#38bdf8"/>
    <circle cx="240" cy="180" r="2" fill="#38bdf8"/>
    <circle cx="300" cy="110" r="2" fill="#38bdf8"/>
    <circle cx="380" cy="40" r="2" fill="#38bdf8"/>
    <circle cx="430" cy="40" r="2" fill="#38bdf8"/>
  </g>
</svg>
